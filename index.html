<!DOCTYPE html>
<html>
<head>
    <title>Ghost Kazino</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <input type="text" id="idDaxilEt" placeholder="ID-ni yaz...">
    <button id="basMenue">Balansı Yoxla</button>
    <div id="netice"></div>

    <script>
        // 2. Mətbəxə qoşuluruq (Supabase açarını buraya yaz)
        const supabase = supabase.createClient('https://osewdxbdimyukysvedxt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZXdkeGJkaW15dWt5c3ZlZHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTg5MDIsImV4cCI6MjA5NTczNDkwMn0.r6pL1NLCT1FQXBuKnVeN8hviSTRf8VuwQLYAr_ZVHdM');

        // 3. Ofisiant (Düyməni dinləyirik)
        document.getElementById('basMenue').addEventListener('click', async () => {
            const id = document.getElementById('idDaxilEt').value;
            const ekran = document.getElementById('netice');
            
            ekran.innerText = "Yoxlanılır...";

            // 4. Mətbəxdən sifarişi istəyirik
            const { data, error } = await supabase
                .from('ghost')
                .select('balance')
                .eq('id', id)
                .single();

            if (error) {
                ekran.innerText = "Xəta: " + error.message;
            } else {
                ekran.innerText = "Balansın: " + data.balance + " AZN";
            }
        });
    </script>
</body>
</html>
