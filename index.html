<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Səhifəsi - Glassmorphism</title>
    <!-- İkonlar üçün Boxicons kitabxanası -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        /* Bütün səhifə üçün təməl stillər */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif; /* Müasir şrift */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-vh: 100vh;
            /* preview.png-dəki dağ mənzərəsinə bənzər arxa plan */
            background: url('https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?q=80&w=2574&auto=format&fit=crop') no-repeat;
            background-size: cover;
            background-position: center;
        }

        /* Glassmorphism effekti verən ana konteyner */
        .wrapper {
            width: 420px;
            background: rgba(255, 255, 255, 0.1); /* Şəffaf ağ fon */
            border: 2px solid rgba(255, 255, 255, 0.2); /* Nazik şüşə kənarı */
            backdrop-filter: blur(20px); /* Arxa planı bulandıran sehrli xüsusiyyət */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            color: #fff; /* Bütün mətnlər ağ */
            border-radius: 10px;
            padding: 30px 40px;
        }

        .wrapper h1 {
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Giriş sahələri üçün stil */
        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 30px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent; /* Şəffaf input */
            border: none;
            outline: none;
            border: 2px solid rgba(255, 255, 255, 0.2); /* İnput kənarı */
            border-radius: 40px;
            font-size: 16px;
            color: #fff;
            padding: 20px 45px 20px 20px;
        }

        .input-box input::placeholder {
            color: #fff; /* Placeholder mətni ağ */
        }

        /* İnput içindəki ikonlar */
        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        /* Remember me və Forgot password hissəsi */
        .remember-forget {
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            margin: -15px 0 15px;
        }

        .remember-forget label input {
            accent-color: #fff; /* Checkbox rəngi */
            margin-right: 3px;
        }

        .remember-forget a {
            color: #fff;
            text-decoration: none;
        }

        .remember-forget a:hover {
            text-decoration: underline;
        }

        /* Login düyməsi */
        .btn {
            width: 100%;
            height: 45px;
            background: #fff; /* Ağ düymə */
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font-size: 16px;
            color: #333; /* Tünd yazı */
            font-weight: 600;
        }

        /* Qeydiyyat linki */
        .register-link {
            font-size: 14.5px;
            text-align: center;
            margin: 20px 0 15px;
        }

        .register-link p a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Email ID" required>
                <i class='bx bxs-user'></i> <!-- İstifadəçi ikonu -->
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
                <i class='bx bxs-lock-alt' ></i> <!-- Kilid ikonu -->
            </div>
            <div class="remember-forget">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>
        </form>
    </div>

</body>
</html>
