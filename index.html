<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost AZE - Balans Yoxlama</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #333; background: #252525; color: white; border-radius: 6px; box-sizing: border-box; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0051a8; }
        .result { margin-top: 20px; font-size: 18px; font-weight: bold; }
        .balance { color: #00ff66; font-size: 24px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Ghost AZE</h2>
    <p>Balansınızı yoxlamaq üçün ID nömrənizi daxil edin:</p>
    <input type="text" id="userId" placeholder="Məsələn: 1001">
    <button onclick="checkBalance()">Yoxla</button>

</div>

<script>

    // Əgər birbaşa script daxilində işlədəcəksənsə, qeyd dəftərindəki real kodları dırnaqların içinə yaza bilərsən:
    const supabase = supabaseServer.createClient('https://osewdxbdimyukysvedxt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZXdkeGJkaW15dWt5c3ZlZHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTg5MDIsImV4cCI6MjA5NTczNDkwMn0.r6pL1NLCT1FQXBuKnVeN8hviSTRf8VuwQLYAr_ZVHdM');

    async function checkBalance() {
        const id = document.getElementById('userId').value.trim();
        const resultDiv = document.getElementById('result');
        
        if(!id) { resultDiv.innerHTML = "Zəhmət olmasa ID yazın!"; return; }
        resultDiv.innerHTML = "Axtarılır...";

        const { data, error } = await supabase.from('ghost').select('balance').eq('id', id).single();

        if (error || !data) {
            resultDiv.innerHTML = "<span style='color:#ff3333;'>ID tapılmadı!</span>";
        } else {
            resultDiv.innerHTML = `Balansınız:<div class="balance">${data.balance} AZN</div>`;
        }
    }
</script>
